 <!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game XOXO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.12);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px #0003;
      width: 340px;
      max-width: 95%;
    }

    h1 {
      margin-top: 0;
      font-size: 36px;
    }

    .status {
      font-size: 18px;
      margin: 20px 0;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .cell {
      width: 100%;
      aspect-ratio: 1;
      border: none;
      border-radius: 12px;
      background: white;
      font-size: 42px;
      font-weight: bold;
      color: #667eea;
      cursor: pointer;
      transition: 0.2s;
    }

    .cell:hover:not(:disabled) {
      background: #e5e7ff;
      transform: scale(1.04);
    }

    .cell:disabled {
      cursor: default;
    }

    .score {
      display: flex;
      justify-content: space-around;
      margin: 22px 0;
      font-size: 16px;
    }

    .score strong {
      display: block;
      font-size: 25px;
      margin-top: 5px;
    }

    .buttons {
      display: flex;
      gap: 10px;
    }

    .buttons button {
      flex: 1;
      padding: 12px 8px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      background: #fff;
      color: #6246a5;
    }

    .buttons button:hover {
      background: #e5e7ff;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🎮 XOXO</h1>
    <p class="status" id="status">
      Giliran pemain X
    </p>

    <div class="board" id="board">
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
    </div>

    <div class="score">
      <div>Pemain X<strong id="scoreX">0</strong></div>
      <div>Seri<strong id="scoreDraw">0</strong></div>
      <div>Pemain O<strong id="scoreO">0</strong></div>
    </div>

    <div class="buttons">
      <button onclick="resetGame()">Main Lagi</button>
      <button onclick="resetScore()">Reset Skor</button>
    </div>
  </div>

  
    <script src="script.js"></script>
  </script>
</body>
</html>
